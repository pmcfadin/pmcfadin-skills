name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests and skills
        run: python3 tests/validate_manifests.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
